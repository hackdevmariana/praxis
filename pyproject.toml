[project]
name = "praxis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.30.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "pdfplumber>=0.11.10",
    "phonenumbers>=9.0.43",
    "pint>=0.26.2",
    "pyjwt>=2.15.1",
    "python-stdnum>=2.2",
    "sqlalchemy[asyncio]>=2.0.44",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "holidays>=0.108",
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
    "testcontainers[postgres]>=4.13.0",
    "time-machine>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["docs", ".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["app", "tests"]
exclude = [".venv", "__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["app", "tests"]
markers = [
    "integration: requiere PostgreSQL real (testcontainers)",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
